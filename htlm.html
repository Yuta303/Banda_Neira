<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tes Background Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: sans-serif;
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 20%;
      background-color: rgba(0, 0, 0, 0.4); /* overlay gelap */
      height: 100%;
    }
  </style>
</head>
<body>

  <video class="video-background" autoplay muted loop playsinline>
    <source src="public/video/banda-neira.webm" type="video/webm">
    Browser Anda tidak mendukung video.
  </video>

  <div class="content">
    <h1>Selamat Datang di Banda Neira</h1>
    <p>Ini adalah video background</p>
  </div>

</body>
</html>
